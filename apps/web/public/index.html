<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="author" content="นายเฉลิมพล จันทร์แดง โรงเรียนบ้านไร่ โทร 086-341-4181">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:,">
<title>BanRai Finance</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Noto+Serif+Thai:wght@500;600;700&family=Sarabun:wght@400;700&display=swap">
<style>
:root{--blue:#14315F;--bluet:#14315F;--bg:#F3F1EA;--card:#FFFFFF;--card2:#FAF9F5;--ink:#172338;--mut:#5A6578;--line:#E3DFD4;--gold:#9C7A2E;--goldbg:#F6EFD9;--in:#1B7355;--out:#B8442C;--warn:#8A5A00;--warnbg:#FBF3DC;--okbg:#E2F2EA;--badbg:#FBE7E2;--shadow:0 1px 2px rgba(23,35,56,.06),0 8px 24px -12px rgba(23,35,56,.18);--r:14px;
 --fh:'Noto Serif Thai','Sarabun',Georgia,serif;--fb:'IBM Plex Sans Thai','Noto Sans Thai',Tahoma,system-ui,sans-serif}
:root[data-tone="soft"]{--bg:#E9E5D9;--card:#F7F4EC;--card2:#F1EDE2;--line:#D8D2C2;--ink:#1B2638;--mut:#566072}
:root[data-tone="dark"]{color-scheme:dark;--bg:#0D1420;--card:#161F2F;--card2:#1B2638;--ink:#E9EDF4;--mut:#9BA7BA;--line:#283449;--gold:#D6B76C;--goldbg:#2A2416;--in:#56C9A0;--out:#F08C74;--warn:#E7C267;--warnbg:#2B2413;--okbg:#14301F;--badbg:#3A1C17;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--fb);display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--fh);margin:0;text-wrap:balance;letter-spacing:0}
h1{font-size:26px;font-weight:700;line-height:1.3}
h2{font-size:17px;font-weight:700;line-height:1.4}
h3{font-size:14px;font-weight:600}
.num,td.n,.big{font-variant-numeric:tabular-nums}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.ic{width:20px;height:20px;flex:none}

/* sidebar */
aside{background:var(--blue);color:#fff;padding:20px 14px 16px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow:auto;background-image:linear-gradient(180deg,rgba(255,255,255,.06),rgba(0,0,0,.18))}
.brand{display:flex;gap:12px;align-items:center;padding:4px 6px 14px;border-bottom:1px solid rgba(255,255,255,.16)}
.brand .logo{width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;box-shadow:0 0 0 2px var(--gold)}
.brand img{width:36px;height:36px;object-fit:contain}
.brand b{font-family:var(--fh);font-size:17px;display:block;line-height:1.3}
.brand small{display:block;font-size:11.5px;opacity:.8;line-height:1.4}
#nav{display:flex;flex-direction:column;gap:2px}
#nav .grp{font-size:11px;letter-spacing:.06em;opacity:.66;padding:14px 10px 4px}
#nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;text-decoration:none;font-size:14.5px;color:rgba(255,255,255,.9);min-height:40px}
#nav a:hover{background:rgba(255,255,255,.1)}
#nav a.on{background:#fff;color:var(--blue);font-weight:600}
#nav a .cnt{margin-left:auto;background:var(--gold);color:#fff;border-radius:99px;font-size:11px;padding:0 7px;line-height:18px;font-weight:600}
.credit{font-size:11.5px;line-height:1.5;opacity:.85;padding:10px 6px 0;margin-top:auto;border-top:1px solid rgba(255,255,255,.16)}.credit a{color:inherit;text-decoration:none}.credit+.side-note{margin-top:0}
.side-note{margin-top:auto;font-size:11.5px;line-height:1.5;opacity:.85;border-top:1px solid rgba(255,255,255,.16);padding:12px 6px 0}
.side-note button{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:4px 10px;margin-top:8px;cursor:pointer;font-size:12px}
#tabs{display:none}

/* main */
main{min-width:0;padding-block:0 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto}
#bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:20px}
#bar .mb{display:none;margin-right:auto;font-family:var(--fh);font-weight:700;align-items:center;gap:8px}
#bar .mb img{width:28px;height:28px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:5px 11px;border-radius:99px;background:var(--okbg);color:var(--in);font-weight:500;white-space:nowrap}
.chip.dirty{background:var(--warnbg);color:var(--warn)}
.chip .ic{width:15px;height:15px}
.rolebox{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut)}
.rolebox select{width:auto;padding:6px 30px 6px 10px;font-size:13.5px;min-height:36px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.top .lead{margin:4px 0 0;color:var(--mut);font-size:14px;max-width:64ch}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.rule{height:3px;width:56px;background:var(--gold);border-radius:2px;margin:8px 0 0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--blue);color:#fff;border:1px solid transparent;border-radius:10px;padding:8px 16px;font-weight:600;font-size:14px;cursor:pointer;min-height:40px;text-decoration:none;white-space:nowrap}
:root[data-tone="dark"] .btn:not(.sec):not(.ok):not(.warn):not(.vio){background:var(--bluet);color:#0D1420}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn.ok{background:var(--in);color:#fff}.btn.warn{background:#A9631A;color:#fff}.btn.vio{background:#4A4399;color:#fff}
:root[data-tone="dark"] .btn.ok{color:#08130E}
.btn.sm{padding:4px 11px;min-height:32px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.q{width:20px;height:20px;border-radius:50%;border:1px solid var(--line);background:var(--card2);color:var(--mut);font-size:12px;font-weight:700;line-height:1;cursor:help;padding:0;vertical-align:middle;margin-left:6px;flex:none}
.q:hover{border-color:var(--gold);color:var(--gold)}
#tip{position:fixed;z-index:90;max-width:280px;background:var(--ink);color:var(--bg);font-size:12.5px;line-height:1.5;padding:8px 11px;border-radius:9px;box-shadow:var(--shadow);pointer-events:none;white-space:pre-line}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card>h2{margin-bottom:2px}
.hint{color:var(--mut);font-size:13px;margin:2px 0 12px;max-width:70ch}
.sub{color:var(--mut);font-size:13px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.two{display:grid;gap:14px;grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.half2{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
.stack{display:flex;flex-direction:column;gap:14px}
.sect{display:flex;align-items:baseline;gap:10px;margin:26px 0 10px;flex-wrap:wrap}
.sect h2{font-size:18px}.sect span{color:var(--mut);font-size:13px}
.big{font-size:24px;font-weight:700;line-height:1.3;font-family:var(--fh)}
.in{color:var(--in)}.out{color:var(--out)}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--c,var(--bluet));border-radius:4px}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:baseline}
.info{display:flex;gap:10px;align-items:flex-start;background:var(--goldbg);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);border-radius:12px;padding:10px 14px;font-size:13.5px;margin-bottom:14px}
.info .ic{color:var(--gold);margin-top:2px}
.warnbox{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:13.5px;margin-bottom:14px}
.empty{text-align:center;color:var(--mut);padding:26px 12px;font-size:14px}
.empty svg{display:block;margin:0 auto 10px;width:120px;height:84px;color:var(--mut)}
.link{cursor:pointer;transition:transform .12s,box-shadow .12s}
.link:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--gold) 60%,var(--line))}
.fundc{border-top:3px solid var(--c)}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:18px;background:var(--blue);color:#fff;padding:26px 28px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.08)}
.hero::after{content:"";position:absolute;inset:0;border-radius:18px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),inset 0 -3px 0 var(--gold);pointer-events:none}
.hero .art{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero>div{position:relative}
.hl{display:flex;gap:18px;align-items:center;min-width:0}
.hlogo{width:78px;height:78px;border-radius:50%;background:#fff;padding:9px;object-fit:contain;flex:none;box-shadow:0 0 0 2px var(--gold),0 0 0 6px rgba(255,255,255,.12)}
.hn{font-family:var(--fh);font-size:15px;opacity:.92}
.hs{font-size:12.5px;opacity:.78}
.hb{font-family:var(--fh);font-size:40px;font-weight:700;line-height:1.25;font-variant-numeric:tabular-nums}
.hb small{font-size:16px;font-weight:500;opacity:.85}
.ha{display:flex;flex-direction:column;gap:8px}
.hbtn{background:#fff;color:var(--blue);border:0;border-radius:10px;padding:9px 18px;font-weight:600;cursor:pointer;min-height:40px;white-space:nowrap}
.hbtn.g{background:transparent;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.5)}

/* menu */
.menu{display:grid;gap:14px;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:14px}
.mg{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.mg header{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,color-mix(in srgb,var(--c) 10%,var(--card)),var(--card))}
.mgi{width:34px;height:34px;border-radius:10px;background:var(--c);color:#fff;display:grid;place-items:center;flex:none}
.mg header b{display:block;font-family:var(--fh);font-size:14.5px;line-height:1.3}
.mg header small{display:block;color:var(--mut);font-size:11.5px;line-height:1.4}
.tile{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 14px;text-decoration:none;min-height:64px;border-bottom:1px solid var(--line)}
.tile:last-child{border-bottom:0}
.tile:hover{background:var(--card2)}
.tile .ti{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
:root[data-tone="dark"] .tile .ti{color:color-mix(in srgb,var(--c) 45%,#fff)}
.tile b{display:block;font-size:14.5px;font-weight:600;line-height:1.35}
.tile small{display:block;color:var(--mut);font-size:12px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .go{color:var(--mut);display:flex;align-items:center;gap:6px}
.tile .cnt{background:var(--gold);color:#fff;border-radius:99px;font-size:11px;padding:0 7px;line-height:18px;font-weight:600}

/* kpi */
.kpis{display:grid;gap:14px;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:14px}
.kpi{padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:start}
.kpi .kl{font-size:12.5px;color:var(--mut)}
.kpi .kv{font-family:var(--fh);font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.35;grid-column:1}
.kpi .kd{font-size:12px;color:var(--mut);grid-column:1/-1}
.kpi .ki{grid-row:1/3;grid-column:2;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--card2);border:1px solid var(--line);color:var(--bluet)}

/* tables */
.scroll{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:600;font-size:12.5px;color:var(--mut);padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td small{display:block;color:var(--mut);font-size:12px}
th.n,td.n{text-align:right;white-space:nowrap}
td.ac{text-align:right;white-space:nowrap}td.ac .btn{margin-left:6px}
tr.lk{cursor:pointer}tr.lk:hover td{background:var(--card2)}
tr.tot td{border-top:2px solid var(--line);font-weight:700;background:var(--card2)}
.b{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap;background:var(--card2);color:var(--mut);border:1px solid var(--line)}
.b.ok{background:var(--okbg);color:var(--in);border-color:transparent}.b.r{background:var(--badbg);color:var(--out);border-color:transparent}
.b.y,.b.p,.b.t{background:var(--warnbg);color:var(--warn);border-color:transparent}
.b.t{background:var(--goldbg);color:var(--gold)}
.delta{font-size:12.5px;font-weight:600;white-space:nowrap}
.task{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.task:last-child{border-bottom:0}
.steps{display:flex;gap:0;flex-wrap:wrap;margin:0 0 14px;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 14px 6px 0;color:var(--mut)}
.steps li::before{content:counter(s);width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.steps li b{color:var(--ink);font-weight:600}
.steps li:not(:last-child)::after{content:"";width:18px;height:1px;background:var(--line);margin-left:6px}

/* charts */
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--fb);font-size:11px;fill:var(--mut)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .hit{fill:transparent}.chart .hit:hover{fill:color-mix(in srgb,var(--ink) 6%,transparent)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.donut{display:grid;grid-template-columns:170px minmax(0,1fr);gap:16px;align-items:center}
.dl{display:grid;gap:8px;font-size:13.5px}
.dl div{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:baseline}
.dl span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl em{font-style:normal;color:var(--mut);font-size:12px;min-width:38px;text-align:right}

/* forms */
label{display:block;font-size:13px;font-weight:600;margin:14px 0 4px}
label .lh{display:block;font-weight:400;color:var(--mut);font-size:12px}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:42px}
textarea{resize:vertical;line-height:1.6}
input[type=checkbox]{width:18px;height:18px;min-height:0;padding:0;accent-color:var(--blue);flex:none}
input[type=file]{padding:7px;font-size:13px}
fieldset{border:0;padding:0;margin:0;min-width:0}
.fh{font-family:var(--fh);font-weight:700;font-size:14.5px;margin:22px 0 0;padding-bottom:6px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}
.fgrid .wide{grid-column:1/-1}
.srow{display:grid;grid-template-columns:170px minmax(0,1fr) minmax(0,1fr);gap:0 16px;align-items:end}
.srow .sl{font-size:13px;font-weight:600;padding-bottom:11px}
.chk{display:flex;align-items:center;gap:10px;font-weight:500;cursor:pointer}
.crrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.frow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:18px}
.savebar{position:sticky;bottom:10px;z-index:5;background:var(--card);border:1px solid var(--gold);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:18px}
.sep{font-weight:700;font-size:13px;border-top:1px solid var(--line);margin-top:16px;padding-top:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.err{color:var(--out);font-size:13px;min-height:0;margin-top:8px;font-weight:600}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.bkta{font-family:ui-monospace,monospace;font-size:12px}
.lnk{color:var(--bluet);font-size:13px;cursor:pointer;text-decoration:underline}
.sgl{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:4px 0}
.sgl i{color:var(--mut)}
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13.5px;min-height:34px}
.seg button.on{background:var(--blue);color:#fff;font-weight:600}
:root[data-tone="dark"] .seg button.on{background:var(--bluet);color:#0D1420}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:36px;height:36px;border-radius:50%;border:3px solid var(--card);background:var(--s);cursor:pointer;box-shadow:0 0 0 1px var(--line)}
.sw button.on{box-shadow:0 0 0 2px var(--gold)}

/* dialog + toast */
dialog{border:1px solid var(--line);border-radius:16px;padding:22px;background:var(--card);color:var(--ink);width:min(520px,calc(100vw - 32px));max-height:calc(100vh - 40px);box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(13,20,32,.55)}
dialog h2{font-size:19px}
dialog .dsub{color:var(--mut);font-size:13px;margin:4px 0 0}
.rev{border:1px solid var(--line);border-radius:12px;margin-top:14px;overflow:hidden}
.rev div{display:grid;grid-template-columns:38% minmax(0,1fr);gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:14px}
.rev div:last-child{border-bottom:0}.rev div:nth-child(odd){background:var(--card2)}
.rev span{color:var(--mut);font-size:13px}.rev b{font-weight:600;overflow-wrap:anywhere}
.cf{display:flex;gap:14px;align-items:flex-start}
.cf svg{width:52px;height:52px;flex:none;color:var(--gold)}
#toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-140%);z-index:100;background:var(--card);color:var(--ink);border:1px solid var(--in);border-left:6px solid var(--in);border-radius:12px;padding:12px 18px 12px 14px;box-shadow:0 18px 50px -14px rgba(0,0,0,.45);transition:transform .25s;max-width:calc(100vw - 32px);display:flex;gap:12px;align-items:center;font-weight:600}
#toast:not(.show){visibility:hidden;opacity:0}
#toast.show{transform:translate(-50%,0)}
#toast.e{border-color:var(--out)}
#toast small{display:block;font-weight:400;color:var(--mut);font-size:12px}
#toast svg{width:28px;height:28px;flex:none;color:var(--in)}#toast.e svg{color:var(--out)}

/* documents */
.tabs2{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tabs2 a{padding:9px 16px;text-decoration:none;font-weight:600;font-size:14px;color:var(--mut);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs2 a.on{color:var(--ink);border-color:var(--gold)}
.tplg{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.tpl{display:grid;grid-template-columns:54px minmax(0,1fr);gap:12px;align-items:start;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;text-align:left;min-height:104px}

.tpl svg{width:54px;height:72px;color:var(--mut)}
.tpl b{display:block;font-size:14px;line-height:1.35}
.tpl small{display:block;color:var(--mut);font-size:12px;line-height:1.45;margin-top:2px}
.tpl em{display:inline-block;font-style:normal;font-size:10.5px;color:var(--warn);background:var(--warnbg);border-radius:99px;padding:0 7px;margin-top:5px}
.docwrap{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;align-items:start;margin-top:16px}
.ctl{position:sticky;top:12px}
.ctl label:first-child{margin-top:0}
.deskw{background:color-mix(in srgb,var(--ink) 10%,var(--bg));border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
#dprev{display:flex;flex-direction:column;gap:16px;align-items:center;--sc:1}
.pgw{width:calc(210mm*var(--sc));height:calc(297mm*var(--sc));box-shadow:0 6px 24px -8px rgba(0,0,0,.45);background:#fff;flex:none;overflow:hidden}
.pgw .sheet{transform:scale(var(--sc));transform-origin:0 0}
.bkl{list-style:none;margin:0;padding:0}
.bkl li{display:grid;grid-template-columns:auto 28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.bkl li:last-child{border-bottom:0}
.bkl .no{width:26px;height:26px;border-radius:50%;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;font-size:12.5px;font-weight:700}
.bkl li.on .no{background:var(--blue);color:#fff;border-color:transparent}
.bkl b{display:block;font-size:14px;font-weight:600;line-height:1.35}.bkl small{color:var(--mut);font-size:12px;display:block}
.bkl .mv{display:flex;gap:4px}
.bkl .mv button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer;padding:0}

/* A4 sheet: always black on white */
.sheet{width:210mm;height:297mm;background:#fff;color:#000;font-family:'TH Sarabun New','TH SarabunPSK','Sarabun',Tahoma,sans-serif;position:relative;overflow:hidden;box-sizing:border-box}
.sheet p{margin:0 0 4pt}.sheet b{font-weight:700}
.sheet .sh{display:grid;grid-template-columns:2.2cm 1fr 2.2cm;align-items:center;margin-bottom:6pt}
.sheet .shl img{width:1.9cm;height:1.9cm;object-fit:contain}
.sheet .sht{text-align:center;line-height:1.15}.sheet .sht b{font-size:1.2em}
.sheet .dh{text-align:center;font-weight:700;font-size:1.35em;margin:4pt 0 6pt}
.sheet .dsb{text-align:center;margin:-4pt 0 8pt}
.sheet .mt{display:flex;justify-content:space-between;margin-bottom:6pt}
.sheet .tb{width:100%;border-collapse:separate;border-spacing:0;border-left:1px solid #000;border-top:1px solid #000;margin:6pt 0;font-size:inherit;table-layout:fixed}
.sheet .tb th,.sheet .tb td{border:0;border-right:1px solid #000;border-bottom:1px solid #000;padding:1pt 5pt;color:#000;font-size:inherit;line-height:inherit;vertical-align:top;background:none;white-space:normal;overflow:hidden}
.sheet .tb th{text-align:center;font-weight:700}
.sheet .tb .a{text-align:right}.sheet .tb .c{text-align:center}
.sheet .tb.rp{font-size:.8em;table-layout:auto}
.sheet .tb.rp th,.sheet .tb.rp td{padding:1pt 3pt}
.sheet .tb.rp th{white-space:nowrap}
.sheet .tb.rp td{white-space:nowrap;overflow:visible}
.sheet .tb.rp td.e{white-space:normal;overflow-wrap:anywhere}
.sheet .sgs>.s1:last-child:nth-child(odd){grid-column:1/-1}
.sheet .sm{font-size:.85em}
.sheet .nt{margin-top:6pt}
.sheet .sgs{display:grid;grid-template-columns:1fr 1fr;gap:18pt 12pt;margin-top:22pt;text-align:center}
.sheet .s1{line-height:1.25}.sheet .rl{font-weight:700}
.sheet .mmh{position:relative;height:1.8cm;margin-bottom:4pt}
.sheet .crut{position:absolute;left:0;top:0;height:1.5cm;width:1.5cm}
.sheet .crut img{height:1.5cm}
.sheet .cph{height:1.5cm;width:1.4cm;border:1px dashed #999;color:#777;font-size:10pt;display:grid;place-items:center}
.sheet .mmt{text-align:center;font-weight:700;font-size:29pt;line-height:1.5cm;padding-top:.2cm}
.sheet .ln{display:flex;gap:6pt;align-items:baseline}
.sheet .lb{font-size:1.25em;white-space:nowrap}
.sheet .fl{flex:1;border-bottom:1px dotted #000;min-height:1em;padding-left:4pt}
.sheet .half{display:flex;gap:6pt;flex:1;align-items:baseline}
.sheet .pi{text-indent:2.5cm;text-align:justify}
.sheet .sg{margin:28pt 0 0 45%;text-align:center;line-height:1.3}
.sheet .pn{position:absolute;left:0;right:0;bottom:.7cm;text-align:center;font-size:14pt}
.sheet .cv{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;border:1.5pt solid #000;outline:.5pt solid #000;outline-offset:-5pt;padding:2.2cm 1.2cm}
.sheet .cv img{width:3.6cm;height:3.6cm;object-fit:contain}
.sheet .cv h1{font-family:inherit;font-size:30pt;line-height:1.3;margin:0}
.sheet .cv h2{font-family:inherit;font-size:22pt;font-weight:400;margin:6pt 0 0}
.sheet .toc div{display:flex;gap:6pt;align-items:baseline;margin:4pt 0}
.sheet .toc i{flex:1;border-bottom:1px dotted #000}
#printroot{display:none}

const DKC={'#0A4FCF':'#3F7FE6','#C2570C':'#D07A35','#7E22CE':'#9F68EA','#0891B2':'#1FA7B8','#0E7490':'#1FA7B8'};

function months(){const ms=[],y0=+FY.s.slice(0,4);for(let k=0;k<12;k++){const d=new Date(y0,9+k,1);ms.push({k:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),l:d.toLocaleDateString('th-TH',{month:'short'}),L:d.toLocaleDateString('th-TH',{month:'long',year:'numeric'}),i:0,o:0,net:0,bal:0})}
 let run=0;const open=S.led.filter(l=>l.kind=='open').reduce((a,l)=>a+l.amt,0);run=open;
 ms.forEach(m=>{S.led.forEach(l=>{if(l.date.slice(0,7)==m.k){if(l.kind=='inc')m.i+=l.amt;else if(l.kind=='exp')m.o-=l.amt}});m.net=m.i-m.o;run+=m.net;m.bal=run});

const curM=()=>today().slice(0,7);
const nice=v=>{if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v))),n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p};
const kb=v=>{const b=v/100;return b>=1e6?(b/1e6).toLocaleString('th-TH',{maximumFractionDigits:2})+' ล้าน':b>=1e3?(b/1e3).toLocaleString('th-TH',{maximumFractionDigits:1})+' พัน':b.toLocaleString('th-TH')};
const topBar=(x,y,w,h)=>{const r=Math.min(4,h,w/2);return h<=0?'':`M${x} ${y+h}V${y+r}a${r} ${r} 0 01${r} ${-r}h${w-2*r}a${r} ${r} 0 01${r} ${r}V${y+h}z`};
function chart(){const ms=months(),[ci,co]=CIO(),W=660,H=250,L=52,T=14,B=30,ph=H-T-B,mx=nice(Math.max(1,...ms.flatMap(m=>[m.i,m.o]))),gw=(W-L-8)/12,bw=Math.min(16,gw/2-5),cm=curM();

 const b=ms.map((m,j)=>{const x=L+j*gw+gw/2,a=m.i/mx*ph,c=m.o/mx*ph,fut=m.k>cm;return `<path d="${topBar(x-bw-1,T+ph-a,bw,a)}" fill="${ci}"/><path d="${topBar(x+1,T+ph-c,bw,c)}" fill="${co}"/><text x="${x}" y="${H-10}" text-anchor="middle"${m.k==cm?' style="font-weight:700;fill:var(--ink)"':''}>${m.l}</text><rect class="hit" x="${L+j*gw}" y="${T}" width="${gw}" height="${ph}" rx="6" data-tt="${m.L}${fut?'\n(ยังไม่ถึง)':''}\nรับ ${fmt(m.i)} บาท\nจ่าย ${fmt(m.o)} บาท\nสุทธิ ${fmt(m.net)} บาท"/>`}).join('');

function balChart(){const all=months(),cm=curM(),ms=all.filter(m=>m.k<=cm),c=LK.tone=='dark'?'#D6B76C':'#9C7A2E',W=660,H=220,L=52,T=18,B=30,ph=H-T-B,pw=W-L-70;
 const open=S.led.filter(l=>l.kind=='open').reduce((a,l)=>a+l.amt,0),pts=[{l:'ยกมา',L:'ยอดยกมาต้นปีงบประมาณ',bal:open},...ms],mx=nice(Math.max(1,...pts.map(p=>p.bal))),sx=i=>L+14+i*(pw-14)/Math.max(5,pts.length-1),sy=v=>T+ph-v/mx*ph;

function parseSel(s,n){const r=new Set(),t=String(s).replace(/[๐-๙]/g,d=>'๐๑๒๓๔๕๖๗๘๙'.indexOf(d)).trim();if(!t)return null;
 for(const part of t.split(/[+,\s]+/).filter(Boolean)){const m=part.match(/^(\d+)(?:-(\d+))?$/);if(!m)return null;let a=+m[1],b=m[2]?+m[2]:a;if(a>b)[a,b]=[b,a];if(a<1||b>n)return null;for(let i=a;i<=b;i++)r.add(i)}
 return [...r].sort((a,b)=>a-b)}
function bPick(v){const r=parseSel(v,B.order.length);if(!r)return toast('พิมพ์ลำดับเป็นตัวเลข 1 ถึง '+B.order.length+' เช่น 1-2+3','e');B.on=r.map(i=>B.order[i-1]);bSave();render();toast('เลือกเอกสารลำดับ '+r.join(', ')+' แล้ว')}
function bTog(k,c){B.on=c?[...B.on.filter(x=>x!=k),k]:B.on.filter(x=>x!=k);bSave();render()}
function bMove(i,d){const j=i+d;if(j<0||j>=B.order.length)return;[B.order[i],B.order[j]]=[B.order[j],B.order[i]];bSave();render()}
function bAll(on){B.on=on?[...B.order]:[];bSave();render()}
P.book=function(){const bd=bookBuild(),cnt=Object.fromEntries(bd.secs.map(s=>[s.k,s.pg.length]));
 return hd('พิมพ์ทั้งเล่ม','','เลือกเอกสารที่ต้องการ จัดลำดับ แล้วพิมพ์รวมเป็นเล่มเดียว มีเลขหน้าและสารบัญให้อัตโนมัติ')+docTabs('book')+info('ตัวเลือกในหน้านี้ระบบจำไว้ให้ในเครื่องนี้ทันทีที่เลือก ไม่ต้องกดบันทึก')
 +`<div class="docwrap"><div class="card ctl"><h2>1. เลือกเดือน</h2><p class="hint">ใช้กับปก รายงานประจำเดือน ใบเสร็จ และใบสำคัญ</p>${monthSel(bM(),"B.month=this.value;render()")}<div class="sep">2. เลือกเอกสาร${Q('ติ๊กเพื่อใส่ในเล่ม ใช้ลูกศรเลื่อนลำดับ\nตัวเลขในวงกลมคือเลขลำดับที่ใช้กับช่องพิมพ์ลำดับด้านล่าง')}</div><ul class="bkl">${B.order.map((k,i)=>{const x=BK.find(y=>y[0]==k),on=B.on.includes(k);return `<li class="${on?'on':''}"><input type="checkbox" id="bk_${k}"${on?' checked':''} onchange="bTog('${k}',this.checked)" aria-label="${x[1]}"><span class="no">${i+1}</span><label for="bk_${k}" style="margin:0;font-weight:400;cursor:pointer"><b>${x[1]}</b><small>${x[2]}${on?' · '+(cnt[k]?cnt[k]+' หน้า':'ไม่มีรายการ'):''}</small></label><span class="mv"><button onclick="bMove(${i},-1)" aria-label="เลื่อนขึ้น"${i?'':' disabled'}>${IC('up')}</button><button onclick="bMove(${i},1)" aria-label="เลื่อนลง"${i<B.order.length-1?'':' disabled'}>${IC('down')}</button></span></li>`}).join('')}</ul><div style="display:flex;gap:8px;margin-top:8px"><button class="btn sm sec" onclick="bAll(1)">เลือกทั้งหมด</button><button class="btn sm sec" onclick="bAll(0)">ไม่เลือกเลย</button></div>${L2('หรือพิมพ์ลำดับที่ต้องการ','เช่น 1-2+3 คือลำดับ 1 ถึง 2 และ 3 · ใช้ - แทน “ถึง” และ + หรือ , แทน “และ”')}<div style="display:flex;gap:8px"><input id="bsel" placeholder="1-2+3" inputmode="text" autocomplete="off" onkeydown="if(event.key==='Enter')bPick(this.value)"><button class="btn sec" onclick="bPick(document.querySelector('#bsel').value)">ใช้</button></div><div class="sep">3. ตัวเลือก</div><label class="chk"><input type="checkbox"${B.pn?' checked':''} onchange="B.pn=this.checked;bSave();drawSheet()">ใส่เลขหน้ากลางท้ายกระดาษ (ไม่นับปก)</label>${printBox()}</div><div class="deskw"><div id="dpv"><div id="dprev"></div></div></div></div>`};

/* ---------- โครงหน้า ---------- */
function render(){if(NET&&!NET.ready)return;save();let p=location.hash.slice(1);if(!P[p])p='dash';const R=ROLES[S.user],ob=NET&&(!NET.fy||(!S.funds.length&&!['set','usr','all','aud'].includes(p)))&&p!='usr'&&!(NET.fy&&p=='set');
 let h=`<a href="#dash" class="${p=='dash'?'on':''}">${IC('home')}หน้าแรก</a>`;
 NAV.forEach(([n,d,c,L])=>{h+=`<div class="grp">${n}</div>`+L.map(k=>{const x=cn(k);return `<a href="#${k}" class="${k==p?'on':''}" title="${PGS[k][1]}">${IC(k)}${PGS[k][0]}${x?`<span class="cnt">${x}</span>`:''}</a>`}).join('')});
 $('#nav').innerHTML=h;
 $('#tabs').innerHTML=[['dash','home','หน้าแรก'],['inc','inc','รับเงิน'],['exp','exp','เบิกจ่าย'],['doc','doc','เอกสาร'],['all','more','เมนู']].map(([k,i,l])=>`<a href="#${k}" class="${k==p||(k=='all'&&!['dash','inc','exp','doc'].includes(p))?'on':''}">${IC(i)}${l}</a>`).join('');
 $('#main').innerHTML=`<div class="wrap"><div id="bar"><div class="mb"><img src="${LOGO}" alt="">BanRai Finance</div><span class="chip" id="svchip" title="${NET?'ทุกรายการบันทึกลงฐานข้อมูลกลางทันทีที่ยืนยัน':'ระบบบันทึกข้อมูลลงเครื่องนี้ทุกครั้งที่ทำรายการสำเร็จ'}">${IC('check')}${SAVED?'บันทึกล่าสุด '+hm(SAVED)+' น.':(NET?'เชื่อมต่อฐานข้อมูลกลาง':'ข้อมูลบันทึกแล้ว')}</span>${NET?`<span class="rolebox"><b style="color:var(--ink)">${esc(R.n)}</b><span>${esc(R.t)}</span></span><button class="btn sm sec" onclick="sync().then(ok=>ok&&toast('โหลดข้อมูลล่าสุดแล้ว'))">โหลดใหม่</button><button class="btn sm sec" onclick="openPw()">รหัสผ่าน</button><button class="btn sm sec" onclick="logout()">ออกจากระบบ</button>`:`<label class="rolebox" style="margin:0;font-weight:400"><span>กำลังใช้งานในบทบาท</span><select aria-label="บทบาท" onchange="setRole(this.value)">${Object.keys(ROLES).map(k=>`<option value="${k}"${k==S.user?' selected':''}>${ROLES[k].t}</option>`).join('')}</select></label>`}<button class="btn sm sec" onclick="openLook()">${IC('look')}แสดงผล</button></div>${ob?netOnboard():P[p]()}</div>`;
 CURP=p;if(!ob&&(p=='doc'||p=='book'))drawSheet()}
let CURP='dash',BACK=false;
function onHash(){if(BACK){BACK=false;return}const to=location.hash.slice(1);if(DIRTY&&to!=CURP){const want=location.hash;BACK=true;location.hash=CURP;return guard(()=>{location.hash=want})}render();scrollTo(0,0);if(NET&&NET.ready)sync()}
loadLook();applyLook();try{new MutationObserver(()=>{followSys();if(!TSET)render()}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});matchMedia('(prefers-color-scheme:dark)').addEventListener('change',followSys)}catch(e){}
document.querySelectorAll('img.lg').forEach(i=>i.src=LOGO);{const ic=document.querySelector('link[rel=icon]');if(ic)ic.href=LOGO}
addEventListener('visibilitychange',()=>{if(NET&&NET.ready&&document.visibilityState=='visible')sync()});addEventListener('resize',()=>{if($('#dprev'))drawSheet()});addEventListener('hashchange',onHash);addEventListener('beforeunload',e=>{if(DIRTY){e.preventDefault();e.returnValue=''}});
boot();

</script>
