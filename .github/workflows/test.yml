name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # No secrets and no Cloudflare access are needed: the tests run on in-memory SQLite.
      - run: python3 tests/db/verify.py
      - run: node --experimental-strip-types --test "tests/integration/*.test.ts"
      - run: node tests/web/logic.test.cjs
